<style>

  .stat span { color: var(--ink-3); font-size: 12px; }
  .stat.hot b { color: var(--accent); }

const badgeClass = (s) => s === 'Offer' ? 's-offer' : s === '拒绝/已结束' ? 's-dead' : s === '面试' ? 's-interview' : s === '测评中' ? 's-test' : (s === '已定制' || s === '待定制' || s === '待确认') ? 's-ready' : 's-sent';

function renderStats() {
  const c = {};
  jobs.forEach((j) => { c[j.status] = (c[j.status] || 0) + 1; });
  const sent = jobs.filter((j) => SENT.includes(j.status)).length;
  const active = (c['测评中'] || 0) + (c['面试'] || 0) + (c['筛选中'] || 0);
  const cells = [
    ['全部', jobs.length, ''],
    ['已投出', sent, 'hot'],
    ['进行中', active, 'hot'],
    ['测评/笔试', c['测评中'] || 0, ''],
    ['面试', c['面试'] || 0, ''],
    ['Offer', c['Offer'] || 0, 'done'],
    ['待投', (c['已定制'] || 0) + (c['待定制'] || 0), ''],
  ];
  $('[data-stats]').innerHTML = cells.map(([k, v, cls]) => `<div class="stat ${cls}"><b>${v}</b><span>${esc(k)}</span></div>`).join('');
}

function renderFunnel() {
  const counts = {};
  jobs.forEach((j) => { counts[j.status] = (counts[j.status] || 0) + 1; });
  const items = [['全部', jobs.length, null], ...DATA.statuses.map((s) => [s, counts[s] || 0, s])];
  $('[data-funnel]').innerHTML = items.map(([label, n, key]) =>
    `<button type="button" class="chip" data-filter="${key === null ? '' : esc(key)}" aria-pressed="${filter === key}">${esc(label)}<i>${n}</i></button>`).join('');
}

function renderMatch(match) {
  if (!match || !match.length) return '';
  const color = (s) => s === '已匹配' ? 'var(--ok)' : s === '真实缺口' ? 'var(--bad)' : s === '待确认' ? 'var(--ink-3)' : 'var(--warn)';
  const counts = {};
  match.forEach((m) => { counts[m.status] = (counts[m.status] || 0) + 1; });
  const total = match.length;
  const bar = Object.entries(counts).map(([k, n]) => `<i style="width:${(n / total) * 100}%;background:${color(k)}"></i>`).join('');
  const legend = Object.entries(counts).map(([k, n]) => `<span><em style="background:${color(k)}"></em>${esc(k)} ${n}</span>`).join('');
  return `<div class="bar">${bar}</div><div class="legend">${legend}</div>`;
}

function renderCard(job) {
  const left = daysLeft(job.deadline);
  const meta = [
    job.city && `<span>${esc(job.city)}</span>`,
    job.channel && `<span>${esc(job.channel)}</span>`,
    job.updated && `<span>更新 ${esc(job.updated)}</span>`,
    left !== null && `<span class="${left <= 3 ? 'due' : ''}">截止 ${esc(job.deadline)}（${left >= 0 ? '剩 ' + left + ' 天' : '已过'}）</span>`,
    job.career_url && `<a class="career" href="${esc(job.career_url)}" target="_blank" rel="noopener">校招官网 ↗</a>`,
  ].filter(Boolean).join('');
  const history = (job.history || []).slice(-4).reverse().map((h) =>
    `<li><time>${esc(h.date)}</time><b>${esc(h.status)}</b>${h.note ? esc(h.note) : ''}</li>`).join('');
  const fit = job.fit ? `<span class="fit ${job.fit.pages === 1 ? 'ok' : 'bad'}">${job.fit.pages === 1 ? '单页 ✓' : job.fit.pages + ' 页'}</span>` : '';
  return `<article class="card ${job.status === '拒绝/已结束' ? 'ended' : ''}">
    <div class="head">
      <div>
        <h2 class="co">${esc(job.company)}</h2>
        <p class="pos">${esc(job.position)}</p>
      </div>
      <span class="badge ${badgeClass(job.status)}">${esc(job.status)}</span>
    </div>
    <div class="meta">${meta}</div>
    ${renderMatch(job.match)}
    ${job.next_step ? `<div class="next"><b>下一步</b>${esc(job.next_step)}</div>` : ''}
    ${history ? `<details><summary>进度时间线（${(job.history || []).length}）</summary><ul class="tl">${history}</ul></details>` : ''}
    <div class="actions">
      ${job.resume ? `<a class="btn primary" href="${enc(job.resume)}" target="_blank">打开简历</a>` : '<span class="btn" aria-disabled="true">简历待定制</span>'}
      ${job.resume ? `<a class="btn" href="${enc(pdfOf(job.resume))}" target="_blank">PDF</a>` : ''}
      ${job.jd ? `<a class="btn" href="${enc(job.jd)}" target="_blank">JD</a>` : ''}
      ${fit}
    </div>
  </article>`;
}

function renderJobs() {
  const kw = keyword.trim().toLowerCase();
  const list = jobs.filter((j) => {
    if (filter && j.status !== filter) return false;
    if (!kw) return true;
    return [j.company, j.position, j.city, j.channel, j.id, ...(j.keywords || [])].join(' ').toLowerCase().includes(kw);
  });
  $('[data-jobs]').innerHTML = list.length ? list.map(renderCard).join('') : `<div class="empty">没有符合条件的记录</div>`;
}

function renderBases() {
  $('[data-bases]').innerHTML = (DATA.bases || []).map((b) => {
    const used = jobs.filter((j) => j.base === b.key).length;
    return `<a class="base" href="${enc(b.resume)}" target="_blank">
      <div class="k">${esc(String(b.key).toUpperCase())}</div>
      <div class="r">${esc(b.role)}</div>
      <div class="u">被 ${used} 份定制简历引用</div>
    </a>`;
  }).join('');
}

let filter = null;
let keyword = '';
$('[data-built]').textContent = DATA.built || '';
$('[data-search]').addEventListener('input', (e) => { keyword = e.target.value; renderJobs(); });
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  const key = btn.dataset.filter;
  filter = key === '' ? null : key;
  renderFunnel(); renderJobs();
});

renderStats(); renderFunnel(); renderJobs(); renderBases();
</script>
</body>
</html>
